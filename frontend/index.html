<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shoplane | E-Commerce</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">SHOPLANE</a>
    <nav><a href="#products">Products</a><a href="cart.html">Cart <span class="cart-badge">0</span></a></nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">YOUR EVERYDAY STORE</p>
      <h1>Find something<br>you’ll love.</h1>
      <p>Explore clothing, electronics, and trending products.</p>
      <a class="button" href="#products">Explore products</a>
    </section>
    <section id="products" class="products-section">
      <div class="section-heading"><div><p class="eyebrow">CURATED FOR YOU</p><h2>Shop products</h2></div></div>
      <p id="load-message" class="message">Loading products…</p>
      <div id="trending-products" class="product-grid"></div>
      <div id="clothing-products" class="product-grid"></div>
      <div id="electronics-products" class="product-grid"></div>
    </section>
  </main>
  <footer>Shoplane — Educational e-commerce demo</footer>
  <script src="js/cart.js"></script>
  <script src="js/api.js"></script>
  <script>loadProducts(); updateCartCounter();</script>
</body>
</html>
